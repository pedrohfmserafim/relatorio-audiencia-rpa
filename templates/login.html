<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Relatório Audiência RPA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.10);
      width: 100%;
      max-width: 380px;
      overflow: hidden;
    }

    .card-header {
      background: #1F4E79;
      color: #fff;
      padding: 28px 32px 20px;
      text-align: center;
    }
    .card-header h1 { font-size: 1.2rem; font-weight: 600; }
    .card-header p  { font-size: .82rem; opacity: .75; margin-top: 4px; }

    .card-body { padding: 32px; display: flex; flex-direction: column; gap: 16px; }

    label { font-size: .85rem; font-weight: 600; color: #374151; display: block; margin-bottom: 5px; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .9rem;
      color: #111;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: #1F4E79; box-shadow: 0 0 0 3px rgba(31,78,121,.12); }

    .error {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .85rem;
      color: #b91c1c;
    }

    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #1F4E79;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: 4px;
    }
    button[type="submit"]:hover { background: #163a5c; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <h1>Relatório Audiência RPA</h1>
    <p>Elaw Viseu + Carrefour — acesso restrito</p>
  </div>
  <form class="card-body" method="POST" action="/login">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <div>
      <label for="user">Usuário</label>
      <input type="text" id="user" name="user" autocomplete="username" required autofocus />
    </div>
    <div>
      <label for="pass">Senha</label>
      <input type="password" id="pass" name="pass" autocomplete="current-password" required />
    </div>
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
